services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      - RELAY_WS_TARGET=ws://relay:3001
    depends_on:
      - relay
    # npm install syncs the node_modules volume with the bind-mounted package.json
    # on every start, so dependency changes only need a container restart
    command: sh -c "npm install && npm run dev"

  relay:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./server:/workspace/server
      - /workspace/server/node_modules
    command: sh -c "npm install && npm start"
